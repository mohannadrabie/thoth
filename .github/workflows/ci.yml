# CI-01: "Thoth's own tests and lints shall run on every change." Every job step below is a real
# gate — lint, typecheck, the full node:test suite, and every QA/OSS instrument's own real check
# (QA-01, QA-02, QA-05, QA-06, QA-13, QA-14, QA-15, QA-16, OSS-01). Any failing step fails the
# job; there is no continue-on-error anywhere in this file, so there is no permanently-pending
# state — a red step is a red job, full stop.
#
# QA-17's runtime-settings-drift-check runs separately, on its own weekly `schedule` trigger only
# (see the `runtime-settings-drift` job below) — it checks REQUIREMENTS.md §1.4 against the
# vendored inventory for drift that can appear even with no code change in this repo (Claude
# Code's own documented settings surface moving), so gating it on push/PR would miss exactly the
# drift it exists to catch.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 06:00 UTC. QA-17's drift check has nothing to do with a code push — it re-
    # diffs the vendored runtime-settings inventory against REQUIREMENTS.md §1.4 on a cadence, so
    # a schedule trigger (not push/PR) is the correct gate for it.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, QA/OSS instruments
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # QA-02, QA-14 (git diff) and OSS-01 (full history scan) all need real history, not a
          # shallow clone.
          fetch-depth: 0
          # submodules is deliberately NOT set here (was `recursive` until 2026-09-09, Issue #27):
          # the `adr` submodule is a PRIVATE repo (mohannadrabie/adr) and this step's own token
          # (the default, repo-scoped GITHUB_TOKEN) cannot read it — every push/PR run died here,
          # silently, from 2026-09-01 onward until this fix (100% failure rate across every run in
          # that window, confirmed via `gh run list --repo mohannadrabie/thoth`; deliberately no
          # hardcoded run count here — that figure only ever climbs while this bug is live, and is
          # not a fact about the fix itself, CLAUDE.md's "no hand-derived completeness claims" rule
          # applied to a comment that would otherwise go stale on every single CI invocation).
          # Submodule init is a separate, later step below, authenticated with a narrower,
          # adr-repo-only credential instead of widening this checkout's own default token's scope.

      # Scopes a SEPARATE credential (ADR_REPO_PAT, a fine-grained PAT with read-only access to
      # ONLY mohannadrabie/adr) to the one URL the `adr` submodule fetch needs — never widens the
      # `Checkout` step's own default GITHUB_TOKEN, which stays scoped to `thoth` itself only.
      #
      # The credential is passed via GIT_CONFIG_COUNT/GIT_CONFIG_KEY_0/GIT_CONFIG_VALUE_0 env vars,
      # SCOPED TO THIS STEP ONLY — never `git config --global`, which would write the token in
      # cleartext into `$HOME/.gitconfig` and leave it there, on disk, for every later step in this
      # job (including `npm ci`'s own install-script execution over every third-party package) to
      # read (Issue #125, infra-security-reviewer, MED). Deliberately no hardcoded step count here
      # — this file's own step list changes shape over time (measured today via a real parse of
      # this file: 25 `- name:` steps in this job total, 23 of them after this one — but that
      # number is exactly the kind of hand-derived claim CLAUDE.md's completeness rule warns
      # against pinning in a comment nothing re-checks; the load-bearing fact is "every later step
      # in this job", which needs no count to stay true). The env-var form
      # also never appears in the rendered `run:` script body on disk — the token lives only in
      # process env for this step, closing the second disk-residency path the same finding named.
      - name: Init adr submodule (private repo, adr-only credential, scoped to this step only)
        env:
          ADR_REPO_PAT: ${{ secrets.ADR_REPO_PAT }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ADR_REPO_PAT }}@github.com/mohannadrabie/adr.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/mohannadrabie/adr.git
        run: |
          set -euo pipefail

          # Issue #128 finding 6 (red-team, LOW, not separately filed per this project's
          # LOW-findings convention): an empty/missing ADR_REPO_PAT must fail HERE, by name — not
          # one step later with a generic "Could not read from remote repository" message that
          # reads identically to an expired PAT, a revoked PAT, or the gitlink race checked below.
          if [ -z "${ADR_REPO_PAT:-}" ]; then
            echo "::error::ADR_REPO_PAT secret is not set (or is empty) -- create it: gh secret set ADR_REPO_PAT --repo mohannadrabie/thoth (fine-grained, mohannadrabie/adr only, Contents: Read-only, 90-day expiry). This step cannot proceed without it."
            exit 1
          fi

          # Issue #127 (red-team, MED): `thoth`'s own `adr` gitlink can point at a commit that
          # exists locally (an agent commits + bumps the gitlink) but was never pushed to the real
          # `adr` remote — pushing to `adr`'s own default branch is human-only (CLAUDE.md), and
          # this repo's own history did exactly this once (commit 79a6ab4, "local, unpushed").
          # Left unchecked, that state fails the submodule clone below with a message
          # indistinguishable from a bad credential. Check reachability FIRST, by name.
          #
          # MEASURED (not assumed, PRINCIPLES rule 18): a fetch of the exact pinned commit
          # (`git fetch <url> <sha>`) was tried first and rejected — verified directly against a
          # real public GitHub repo (torvalds/linux) that GitHub's server refuses to fetch a
          # reachable-but-non-ref-tip commit by bare SHA ("not our ref", exit 128) without
          # `uploadpack.allowReachableSHA1InWant`, which is not enabled here. So this check instead
          # compares against `git ls-remote`'s ref tips, matching this project's own actual
          # practice (every historical `adr` gitlink bump in this repo's own log has pinned the new
          # tip of `adr`'s `main` at acceptance time, never an older non-tip commit) — same
          # mechanism red-team's own report verified working against this exact repo/SHA. Disclosed
          # limitation, not silently assumed complete: a legitimate pin to an OLDER, non-tip-but-
          # still-reachable `adr` commit would misreport as unreachable here (see docs/backlog.md).
          PINNED_SHA="$(git ls-tree HEAD adr | awk '{print $3}')"
          if [ -z "$PINNED_SHA" ]; then
            echo "::error::no gitlink found for path 'adr' at HEAD -- .gitmodules or the tree entry is missing/misconfigured."
            exit 1
          fi

          # Issue #132 (red-team round 2, MED): the ls-remote CALL and the SHA-tip GREP are two
          # separate failure modes that were previously conflated into one `if !` branch under
          # `set -euo pipefail` -- a failed `ls-remote` (bad/expired/revoked ADR_REPO_PAT, or a
          # network/throttle failure) took the SAME branch as "ls-remote succeeded but the pinned
          # SHA isn't a ref tip", and the shared message unconditionally asserted "This is NOT a
          # credential problem" -- which is exactly wrong on the day-91-expired-PAT case. Split:
          # capture ls-remote's own output AND exit status first, attribute a call failure to the
          # credential/network cause by name; only once ls-remote itself succeeded does an absent
          # SHA get attributed to the gitlink-reachability cause instead.
          if ! LS_REMOTE_OUTPUT="$(git ls-remote https://github.com/mohannadrabie/adr.git 2>&1)"; then
            echo "::error::git ls-remote itself FAILED against the adr remote (github.com/mohannadrabie/adr) -- this IS a credential or network problem, not a gitlink-reachability question. Likely causes: ADR_REPO_PAT is invalid, expired (90-day expiry per docs/decisions.md's 2026-09-09 ruling), revoked, or under-scoped; or a network/throttle failure reaching github.com. Unlock: regenerate and reset the secret (gh secret set ADR_REPO_PAT --repo mohannadrabie/thoth). Raw ls-remote output: $LS_REMOTE_OUTPUT"
            exit 1
          fi
          if ! echo "$LS_REMOTE_OUTPUT" | grep -q "$PINNED_SHA"; then
            echo "::error::adr gitlink $PINNED_SHA is NOT reachable on the adr remote (github.com/mohannadrabie/adr) -- the adr submodule's own commit needs to be pushed there first (pushing to adr's default branch is human-only, CLAUDE.md). This is NOT a credential problem: ls-remote itself SUCCEEDED above (using the exact same ADR_REPO_PAT credential the submodule init below uses) -- it just didn't list this SHA among its ref tips. (Known limitation: this compares against ref TIPS only -- a legitimate pin to an older, non-tip-but-reachable adr commit would also fail this check; see docs/backlog.md.)"
            exit 1
          fi

          git submodule update --init --recursive
          git submodule status

          # Issue #128 (red-team, MED): `git submodule status` above exits 0 and prints NOTHING
          # when the submodule isn't actually registered/populated -- a vacuous pass, the exact
          # defense Issue #27 proved silently does not work. Assert real, non-empty content
          # instead of trusting the diagnostic line above.
          if [ -z "$(ls -A adr/devops 2>/dev/null)" ] || [ -z "$(ls -A adr/software-engineering 2>/dev/null)" ]; then
            echo "::error::adr submodule did not populate -- adr/devops and/or adr/software-engineering is empty after 'git submodule update --init --recursive'. QA-14 would run against an EMPTY ADR catalog (a vacuous pass), not a real one."
            exit 1
          fi

          # Issue #125 (infra-security-reviewer, MED): re-confirm the GIT_CONFIG_* env-var form
          # above never wrote ADR_REPO_PAT to disk -- assert it, don't just trust the mechanism.
          if grep -rq "x-access-token" "$HOME/.gitconfig" 2>/dev/null; then
            echo "::error::ADR_REPO_PAT credential residue found in \$HOME/.gitconfig -- this should be structurally impossible with the GIT_CONFIG_* env-var form used above."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches package.json engines floor — measured, not assumed (Node 22.18.0 is the first
          # 22.x LTS build with unflagged TypeScript type-stripping; see src/lib/exec.ts's own
          # measured-facts convention, PRINCIPLES.md rule 18).
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (full node:test suite)
        run: npm test

      - name: Resolve diff base/head refs for diff-aware checks
        id: diff-refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: QA-01 fixture-coverage-check
        run: node src/qa/fixture-coverage-check.ts

      - name: QA-02 diff-fixture-check
        run: node src/qa/diff-fixture-check.ts "${{ steps.diff-refs.outputs.base }}" "${{ steps.diff-refs.outputs.head }}"

      - name: QA-05 fixture-isolation-check
        run: node src/qa/fixture-isolation-check.ts

      - name: QA-06 mutation-harness (standing gate; self-test proof runs under `npm test` above)
        run: node src/qa/mutation-harness.ts

      - name: QA-06 shell-detector-mutants (S4, Milestone #22 — real registered mutant classes)
        run: node src/qa/shell-detector-mutants.ts

      - name: QA-13 recurring-findings-registry
        run: node src/qa/recurring-findings-registry.ts

      - name: QA-14 reference-resolver
        run: node src/qa/reference-resolver.ts "${{ steps.diff-refs.outputs.base }}" "${{ steps.diff-refs.outputs.head }}"

      - name: QA-15 completeness-claim-checker
        run: node src/qa/completeness-claim-checker.ts

      - name: QA-16 broken-instrument-gate
        run: node src/qa/broken-instrument-gate.ts

      - name: S2 kernel-purity-check (ADR-0021 POL-11 structural gate)
        run: node src/qa/kernel-purity-check.ts

      - name: S3 normalizer-registry-purity-check (ADR-0021 POL-12 structural gate)
        run: node src/qa/normalizer-registry-purity-check.ts

      - name: S5 gate-command-path-check (SUR-13 precondition / Issue #87 fix, Milestone #23)
        run: node src/qa/gate-command-path-check.ts

      - name: S5 gate-manifest-check (SUR-13, Milestone #23)
        run: node src/qa/gate-manifest-check.ts

      - name: S5 gate-matcher-drift-check (SUR-05, Milestone #23)
        run: node src/qa/gate-matcher-drift-check.ts

      - name: S5 gate-latency-budget-check (OPS-03, Milestone #23 — CI-10 incident on overrun, never a change to the separate 60s enforcement timeout)
        run: node src/qa/gate-latency-budget-check.ts

      - name: OSS-01 full-history secret scan
        run: node src/secret-scan/history-scan.ts

      - name: Upload OSS-01 redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-scan-report
          path: docs/qa/history-scan-report.json
          if-no-files-found: ignore

  # QA-17: runs only on the weekly `schedule` trigger above — a separate job, own checkout/setup,
  # never folded into the push/PR `ci` job's steps. Drift here has nothing to do with a code push
  # in this repo: it can appear purely because Claude Code's own documented runtime-settings
  # surface moved upstream, so a cadence-based check is correct, and gating it on push/PR would
  # both miss that drift and fire it on every unrelated change.
  runtime-settings-drift:
    name: QA-17 runtime-settings-drift-check (scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches package.json engines floor, same as the `ci` job above.
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: QA-17 runtime-settings-drift-check
        run: npm run qa:runtime-settings-drift
